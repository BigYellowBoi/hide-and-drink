name: Keep Supabase awake

# Supabase pauses free projects after about a week with no activity. This signs in
# anonymously and runs two real queries every 3 days so the project never goes idle.
# It also ends games with no events for 24 h (end_stale_games: no winner unless a round
# finished), which frees their join codes.
# Each run leaves one anonymous user behind (about 120 a year; harmless).
#
# Scheduled workflows run from the default branch only. GitHub disables them after
# 60 days without repository activity: re-enable under Actions if that happens.

on:
  schedule:
    - cron: '17 3 */3 * *' # 03:17 UTC every 3 days
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          # The same repository variables the build uses.
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository variables"
            exit 1
          fi
          url="${SUPABASE_URL%/}"
          token="$(curl -fsS --retry 3 -X POST "$url/auth/v1/signup" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}' \
            | jq -re .access_token)"
          auth=(-H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token")
          echo "Server time: $(curl -fsS --retry 3 -X POST "$url/rest/v1/rpc/server_time" "${auth[@]}" \
            -H "Content-Type: application/json" -d '{}')"
          echo "Cards: $(curl -fsS --retry 3 "$url/rest/v1/cards?select=id&limit=1" "${auth[@]}")"
          echo "Stale games ended: $(curl -fsS --retry 3 -X POST "$url/rest/v1/rpc/end_stale_games" "${auth[@]}" \
            -H "Content-Type: application/json" -d '{}')"
