name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Database: start a real local Supabase stack, apply every migration, run pgTAP tests.
      # Pinned: "latest" asks the GitHub API for the newest release and fails when rate limited.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start local Supabase (applies all migrations)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Database tests
        run: supabase test db
      # Simulated players on the local stack; fails the build (and so the deploy) if p95 > 1 s.
      - name: Latency harness
        run: |
          export SUPABASE_URL="$(supabase status -o json | jq -r .API_URL)"
          export SUPABASE_ANON_KEY="$(supabase status -o json | jq -r .ANON_KEY)"
          npm run latency
        env:
          LATENCY_PLAYERS: 10
          LATENCY_P95_MS: 1000
      - run: npm run build
        env:
          # Set under Settings > Secrets and variables > Actions > Variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
